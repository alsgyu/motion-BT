# ==========================================================================
# Smoothing Configuration for BT cmd_vel → RL Policy bridge
# ==========================================================================
#
# [수정 방법]
#   이 파일만 수정하고 deploy runner를 재시작하면 반영됩니다. 빌드 불필요.
#   CLI로 덮어쓰려면: --smoothing-alpha 0.2 --deadband 0.1
#
# [좌표계]
#   모든 값은 NORMALIZED [-1, 1] 공간에서 동작합니다.
#   raw cmd_vel(m/s)을 task config의 max_vx/vy/vyaw로 나눈 후 처리합니다.
#   예: max_vx=0.5일 때 raw 0.25 m/s → normalized 0.5
#
# [처리 파이프라인]
#   raw cmd → 정규화 → 데드밴드 → EMA 저역통과필터 → Rate Limiter
#            → Ramp-aware Output Clamp → RL 정책
# ==========================================================================

smoothing:
  # ------------------------------------------------------------------
  # alpha: EMA(지수이동평균) 저역통과필터 계수
  # ------------------------------------------------------------------
  # 새로운 명령과 이전 smoothing 값 사이의 가중치.
  #   smoothed = alpha * new_raw + (1-alpha) * prev_smoothed
  #
  # 낮을수록(0.1): 명령 변화에 둔감, 부드럽지만 반응이 느림.
  #             발이 꼬이거나 넘어지는 문제가 있으면 낮춰볼 것 (0.1~0.2)
  # 높을수록(0.7): 명령에 빠르게 반응, 원본에 가까움.
  #               흔들림 없이 잘 걸으면 높여도 됨.
  # 0.0: 출력 고정 (절대 안 바뀜, 테스트용)
  # 1.0: 필터 없음 (원본 그대로 통과)
  alpha: 1.0

  # ------------------------------------------------------------------
  # max_delta_vx / vy / vyaw: Rate Limiter (스텝당 최대 변화량)
  # ------------------------------------------------------------------
  # 1.0 = 제한 없음 (한 스텝에 full range 변경 가능).
  max_delta_vx: 1.0
  max_delta_vy: 1.0
  max_delta_vyaw: 1.0

  # ------------------------------------------------------------------
  # deadband: 불감대 (이 값 미만은 0으로 처리)
  # ------------------------------------------------------------------
  # 0.0 = 데드밴드 비활성화.
  deadband: 0.0

  # ------------------------------------------------------------------
  # stop_decay_alpha: 정지 감속 계수 (명령 타임아웃 시)
  # ------------------------------------------------------------------
  # 1.0 = 명령 끊기면 즉시 정지.
  stop_decay_alpha: 1.0

  # ------------------------------------------------------------------
  # max_output_vx / vy / vyaw: 출력 절대값 제한 (Hard Clamp)
  # ------------------------------------------------------------------
  # 1.0 = 제한 없음.
  max_output_vx: 1.0
  max_output_vy: 1.0
  max_output_vyaw: 1.0

  # ------------------------------------------------------------------
  # ramp_up_time_sec / ramp_start_output: 출발 Ramp-up
  # ------------------------------------------------------------------
  # 0.0 = ramp 비활성화. 출발 즉시 full output.
  ramp_up_time_sec: 0.0
  ramp_start_output: 0.0

# ==========================================================================
# Presets (원하는 프리셋을 위쪽 smoothing: 아래에 붙여넣어 사용)
# ==========================================================================
#
# [safe]   – 보수적. 실제 로봇 첫 테스트용.
#   alpha: 0.2
#   max_delta_vx: 0.05
#   max_delta_vy: 0.05
#   max_delta_vyaw: 0.08
#   deadband: 0.12
#   stop_decay_alpha: 0.3
#   max_output_vx: 0.6
#   max_output_vy: 0.5
#   max_output_vyaw: 0.5
#   ramp_up_time_sec: 3.0
#   ramp_start_output: 0.4
#
# [balanced] – 기본값. 대부분 상황에 무난.
#   alpha: 0.3
#   max_delta_vx: 0.15
#   max_delta_vy: 0.15
#   max_delta_vyaw: 0.2
#   deadband: 0.08
#   stop_decay_alpha: 0.5
#   max_output_vx: 1.0
#   max_output_vy: 1.0
#   max_output_vyaw: 1.0
#   ramp_up_time_sec: 2.0
#   ramp_start_output: 0.5
#
# [sport]  – 민첩. 시뮬레이션 or 안정적인 보행.
#   alpha: 0.5
#   max_delta_vx: 0.25
#   max_delta_vy: 0.25
#   max_delta_vyaw: 0.3
#   deadband: 0.03
#   stop_decay_alpha: 0.7
#   max_output_vx: 1.0
#   max_output_vy: 1.0
#   max_output_vyaw: 1.0
#   ramp_up_time_sec: 1.0
#   ramp_start_output: 0.6
#
# [raw]    – 필터 없음. 디버깅/비교용.
#   alpha: 1.0
#   max_delta_vx: 1.0
#   max_delta_vy: 1.0
#   max_delta_vyaw: 1.0
#   deadband: 0.0
#   stop_decay_alpha: 1.0
#   max_output_vx: 1.0
#   max_output_vy: 1.0
#   max_output_vyaw: 1.0
#   ramp_up_time_sec: 0.0
#   ramp_start_output: 0.0
# ==========================================================================
