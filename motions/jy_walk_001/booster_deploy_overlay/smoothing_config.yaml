# ==========================================================================
# Smoothing Configuration for BT cmd_vel → RL Policy bridge
# ==========================================================================
#
# [수정 방법]
#   이 파일만 수정하고 deploy runner를 재시작하면 반영됩니다. 빌드 불필요.
#   CLI로 덮어쓰려면: --smoothing-alpha 0.2 --deadband 0.1
#
# [좌표계]
#   모든 값은 NORMALIZED [-1, 1] 공간에서 동작합니다.
#   raw cmd_vel(m/s)을 task config의 max_vx/vy/vyaw로 나눈 후 처리합니다.
#   예: max_vx=0.5일 때 raw 0.25 m/s → normalized 0.5
#
# [처리 파이프라인]
#   raw cmd → 정규화 → 데드밴드 → EMA 저역통과필터 → Rate Limiter
#            → Ramp-aware Output Clamp → RL 정책
# ==========================================================================

smoothing:
  # ------------------------------------------------------------------
  # alpha: EMA(지수이동평균) 저역통과필터 계수
  # ------------------------------------------------------------------
  # 새로운 명령과 이전 smoothing 값 사이의 가중치.
  #   smoothed = alpha * new_raw + (1-alpha) * prev_smoothed
  #
  # 낮을수록(0.1): 명령 변화에 둔감, 부드럽지만 반응이 느림.
  #             발이 꼬이거나 넘어지는 문제가 있으면 낮춰볼 것 (0.1~0.2)
  # 높을수록(0.7): 명령에 빠르게 반응, 원본에 가까움.
  #               흔들림 없이 잘 걸으면 높여도 됨.
  # 0.0: 출력 고정 (절  # 1. motion-BT pull
  cd /home/booster/Workspace/motion-BT
  git pull
  
  # 2. 업데이트된 파일을 INHA-Player로 복사
  ./scripts/install_into_inha_player.sh /home/booster/Workspace/INHA-Soccer
  
  # 3. 파일이 제대로 들어갔는지 확인
  grep -n "ramp_up_time_sec" /home/booster/Workspace/INHA-Soccer/INHA-Player/motions/jy_walk_001/booster_deploy_overlay/smoothing_config.yaml
  
  # 4. runner 재시작대 안 바뀜, 테스트용)
  # 1.0: 필터 없음 (원본 그대로 통과, 이전 방식과 동일)
  #
  # 권장: 발 꼬임 문제 → 0.15~0.2 / 보통 → 0.3 / 민첩 → 0.5~0.7
  alpha: 0.3

  # ------------------------------------------------------------------
  # max_delta_vx / vy / vyaw: Rate Limiter (스텝당 최대 변화량)
  # ------------------------------------------------------------------
  # smoothed 출력이 한 스텝에 변할 수 있는 최대폭 (normalized 단위).
  # EMA만으로는 급격한 점프를 완전히 막을 수 없을 때 보완.
  #
  # 예: max_delta_vx=0.1이면, 이전 출력이 0.3일 때
  #     새 명령이 아무리 커도 이번 스텝 출력은 최대 0.4까지만 증가.
  #
  # vx(전후진): 보통 0.1~0.2. 넘어지면 0.05~0.08까지 낮춰볼 것.
  # vy(횡방향): vx와 비슷하게. 옆으로 넘어지면 낮출 것.
  # vyaw(회전):   회전하며 발이 꼬이면 0.08까지 낮춰볼 것.
  #              보통 vx/vy보다 조금 높게 잡음 (회전이 더 자주 변하므로).
  #
  # ramp_up과 함께 쓸 경우:
  #   ramp_up이 출발 시 절대 상한을 제한하므로, max_delta는 주행 중
  #   방향전환/급정거 부드러움만 담당. 0.1~0.2로 충분.
  max_delta_vx: 0.15
  max_delta_vy: 0.15
  max_delta_vyaw: 0.2

  # ------------------------------------------------------------------
  # deadband: 불감대 (이 값 미만은 0으로 처리)
  # ------------------------------------------------------------------
  # |normalized cmd| < deadband → 0으로 간주하고 이후 필터에 입력.
  # 목적: (1) 노이즈/지터 제거  (2) 미세한 떨림 명령 무시
  #
  # 예: max_vx=0.5 m/s, deadband=0.08 → 0.04 m/s 미만은 무시
  #     max_vx=0.5 m/s, deadband=0.15 → 0.075 m/s 미만은 무시
  #
  # 너무 낮으면(0.01~0.03): 노이즈는 잡히지만, BT가 미세하게 흔들며
  #                        내는 명령은 그대로 통과 → 떨림 지속.
  # 적당(0.05~0.10):       작은 떨림 무시. 일반적인 walking에 무리 없음.
  # 높게(0.12~0.20):       확실한 명령만 통과. 단, 느린 이동이 안 될 수
  #                        있으니 Chase 노드의 min_abs_vx와 같이 확인.
  # 0.0:                   데드밴드 비활성화.
  #
  # 권장: 떨림 잡기 → 0.08~0.12 / 시뮬레이션 → 0.02 / 데드밴드 끄기 → 0.0
  deadband: 0.08

  # ------------------------------------------------------------------
  # stop_decay_alpha: 정지 감속 계수 (명령 타임아웃 시)
  # ------------------------------------------------------------------
  # BT가 cmd_vel 발행을 멈췄을 때(= timeout_sec 초과),
  # smoothed 출력이 0으로 감소하는 속도.
  #   smoothed = (1 - decay_alpha) * prev_smoothed
  #
  # 낮을수록(0.1~0.3): 천천히 감속. 급정거로 인한 넘어짐 방지.
  #                    단, 명령이 끊긴 후에도 한동안 움직임.
  # 높을수록(0.7~1.0): 빠르게 정지. 1.0이면 즉시 0.
  #
  # 권장: 넘어짐 방지 → 0.3 / 보통 → 0.5 / 즉시 정지 → 1.0
  stop_decay_alpha: 0.5

  # ------------------------------------------------------------------
  # max_output_vx / vy / vyaw: 출력 절대값 제한 (Hard Clamp)
  # ------------------------------------------------------------------
  # 최종 smoothed 출력의 절대값을 이 값 이하로 제한.
  #   if |output| > max_output → clamp
  #
  # 목적: BT가 아무리 큰 명령을 보내도 RL 정책에 전달되는
  #       최대 속도 명령을 안전 범위로 제한.
  #
  # 예: max_output_vx=0.6, max_vx=0.5 m/s 이면 실제 최대 속도는 0.3 m/s
  #
  # 1.0: 제한 없음 (기본값).
  # 0.5~0.7: 보수적. 처음 테스트할 때 추천.
  # 0.0: 해당 축 완전 차단.
  #
  # ramp_start_output과 함께 사용하면:
  #   출발 시 ramp_start_output에서 시작 → ramp_up_time_sec 동안
  #   이 값까지 선형 증가. 멈췄다 다시 출발하면 ramp 리셋.
  max_output_vx: 1.0
  max_output_vy: 1.0
  max_output_vyaw: 1.0

  # ------------------------------------------------------------------
  # ramp_up_time_sec / ramp_start_output: 출발 Ramp-up
  # ------------------------------------------------------------------
  # 첫 출발(또는 멈췄다 다시 출발) 시 max_output을 안전한 값에서
  # 시작해 점진적으로 목표치까지 올립니다.
  #
  # 동작:
  #   - 명령이 0→nonzero로 바뀌는 순간, 출력 clamp가 ramp_start_output으로 설정
  #   - ramp_up_time_sec 동안 clamp가 max_output까지 선형 증가
  #   - 이미 주행 중이면 ramp는 이미 풀려서 max_output 전체 사용
  #   - 멈추면(decay→0) ramp 리셋. 다음 출발 시 다시 ramp
  #
  # ramp_start_output: 출발 시 초기 출력 clamp.
  #   넘어지지 않는 최대값으로 설정. 예: 0.5~0.7.
  #   0.0 = ramp 없이 즉시 max_output 적용 (0.0이면 사실상 비활성화와 동일)
  #
  # ramp_up_time_sec: ramp_start_output → max_output까지 걸리는 시간(초).
  #   예: ramp_start_output=0.5, max_output_vx=1.0, ramp_up_time_sec=2.0
  #        → 0초: clamp=0.5, 1초: clamp=0.75, 2초: clamp=1.0
  #   0.0 = ramp 비활성화. 출발 즉시 max_output 적용.
  #
  # max_delta와의 관계:
  #   ramp_up은 "절대 상한"을 시간에 따라 올리고,
  #   max_delta는 "스텝 간 변화량"을 제한합니다.
  #   둘이 함께 쓰면: 출발 시 ramp가 상한을 0.5로 묶고,
  #   max_delta가 그 안에서도 스텝 간 급격한 점프를 방지.
  #
  # 권장: ramp_start_output=0.5, ramp_up_time_sec=2.0
  ramp_up_time_sec: 2.0
  ramp_start_output: 0.5

# ==========================================================================
# Presets (원하는 프리셋을 위쪽 smoothing: 아래에 붙여넣어 사용)
# ==========================================================================
#
# [safe]   – 보수적. 실제 로봇 첫 테스트용.
#   alpha: 0.2
#   max_delta_vx: 0.05
#   max_delta_vy: 0.05
#   max_delta_vyaw: 0.08
#   deadband: 0.12
#   stop_decay_alpha: 0.3
#   max_output_vx: 0.6
#   max_output_vy: 0.5
#   max_output_vyaw: 0.5
#   ramp_up_time_sec: 3.0
#   ramp_start_output: 0.4
#
# [balanced] – 기본값. 대부분 상황에 무난.
#   alpha: 0.3
#   max_delta_vx: 0.15
#   max_delta_vy: 0.15
#   max_delta_vyaw: 0.2
#   deadband: 0.08
#   stop_decay_alpha: 0.5
#   max_output_vx: 1.0
#   max_output_vy: 1.0
#   max_output_vyaw: 1.0
#   ramp_up_time_sec: 2.0
#   ramp_start_output: 0.5
#
# [sport]  – 민첩. 시뮬레이션 or 안정적인 보행.
#   alpha: 0.5
#   max_delta_vx: 0.25
#   max_delta_vy: 0.25
#   max_delta_vyaw: 0.3
#   deadband: 0.03
#   stop_decay_alpha: 0.7
#   max_output_vx: 1.0
#   max_output_vy: 1.0
#   max_output_vyaw: 1.0
#   ramp_up_time_sec: 1.0
#   ramp_start_output: 0.6
#
# [raw]    – 필터 없음. 디버깅/비교용.
#   alpha: 1.0
#   max_delta_vx: 1.0
#   max_delta_vy: 1.0
#   max_delta_vyaw: 1.0
#   deadband: 0.0
#   stop_decay_alpha: 1.0
#   max_output_vx: 1.0
#   max_output_vy: 1.0
#   max_output_vyaw: 1.0
#   ramp_up_time_sec: 0.0
#   ramp_start_output: 0.0
# ==========================================================================
