# ==========================================================================
# Smoothing Configuration for BT cmd_vel → RL Policy bridge
# ==========================================================================
#
# [수정 방법]
#   이 파일만 수정하고 deploy runner를 재시작하면 반영됩니다. 빌드 불필요.
#   CLI로 덮어쓰려면: --smoothing-alpha 0.2 --deadband 0.1
#
# [좌표계]
#   모든 값은 NORMALIZED [-1, 1] 공간에서 동작합니다.
#   raw cmd_vel(m/s)을 task config의 max_vx/vy/vyaw로 나눈 후 처리합니다.
#   예: max_vx=0.5일 때 raw 0.25 m/s → normalized 0.5
#
# [처리 파이프라인]
#   raw cmd → 정규화 → 데드밴드 → EMA 저역통과필터 → Rate Limiter → RL 정책
# ==========================================================================

smoothing:
  # ------------------------------------------------------------------
  # alpha: EMA(지수이동평균) 저역통과필터 계수
  # ------------------------------------------------------------------
  # 새로운 명령과 이전 smoothing 값 사이의 가중치.
  #   smoothed = alpha * new_raw + (1-alpha) * prev_smoothed
  #
  # 낮을수록(0.1): 명령 변화에 둔감, 부드럽지만 반응이 느림.
  #             발이 꼬이거나 넘어지는 문제가 있으면 낮춰볼 것 (0.1~0.2)
  # 높을수록(0.7): 명령에 빠르게 반응, 원본에 가까움.
  #               흔들림 없이 잘 걸으면 높여도 됨.
  # 0.0: 출력 고정 (절대 안 바뀜, 테스트용)
  # 1.0: 필터 없음 (원본 그대로 통과, 이전 방식과 동일)
  #
  # 권장: 발 꼬임 문제 → 0.15~0.2 / 보통 → 0.3 / 민첩 → 0.5~0.7
  alpha: 0.3

  # ------------------------------------------------------------------
  # max_delta_vx / vy / vyaw: Rate Limiter (스텝당 최대 변화량)
  # ------------------------------------------------------------------
  # smoothed 출력이 한 스텝에 변할 수 있는 최대폭 (normalized 단위).
  # EMA만으로는 급격한 점프를 완전히 막을 수 없을 때 보완.
  #
  # 예: max_delta_vx=0.1이면, 이전 출력이 0.3일 때
  #     새 명령이 아무리 커도 이번 스텝 출력은 최대 0.4까지만 증가.
  #
  # vx(전후진): 보통 0.1~0.2. 넘어지면 0.08까지 낮춰볼 것.
  # vy(횡방향): vx와 비슷하게. 옆으로 넘어지면 낮출 것.
  # vyaw(회전):   회전하며 발이 꼬이면 0.1까지 낮춰볼 것.
  #              보통 vx/vy보다 조금 높게 잡음 (회전이 더 자주 변하므로).
  max_delta_vx: 0.15
  max_delta_vy: 0.15
  max_delta_vyaw: 0.2

  # ------------------------------------------------------------------
  # deadband: 불감대 (이 값 미만은 0으로 처리)
  # ------------------------------------------------------------------
  # |normalized cmd| < deadband → 0으로 간주하고 이후 필터에 입력.
  # 목적: (1) 노이즈/지터 제거  (2) 미세한 떨림 명령 무시
  #
  # 예: max_vx=0.5 m/s, deadband=0.08 → 0.04 m/s 미만은 무시
  #     max_vx=0.5 m/s, deadband=0.15 → 0.075 m/s 미만은 무시
  #
  # 너무 낮으면(0.01~0.03): 노이즈는 잡히지만, BT가 미세하게 흔들며
  #                        내는 명령은 그대로 통과 → 떨림 지속.
  # 적당(0.05~0.10):       작은 떨림 무시. 일반적인 walking에 무리 없음.
  # 높게(0.12~0.20):       확실한 명령만 통과. 단, 느린 이동이 안 될 수
  #                        있으니 Chase 노드의 min_abs_vx와 같이 확인.
  # 0.0:                   데드밴드 비활성화.
  #
  # 권장: 떨림 잡기 → 0.08~0.12 / 시뮬레이션 → 0.02 / 데드밴드 끄기 → 0.0
  deadband: 0.08

  # ------------------------------------------------------------------
  # stop_decay_alpha: 정지 감속 계수 (명령 타임아웃 시)
  # ------------------------------------------------------------------
  # BT가 cmd_vel 발행을 멈췄을 때(= timeout_sec 초과),
  # smoothed 출력이 0으로 감소하는 속도.
  #   smoothed = (1 - decay_alpha) * prev_smoothed
  #
  # 낮을수록(0.1~0.3): 천천히 감속. 급정거로 인한 넘어짐 방지.
  #                    단, 명령이 끊긴 후에도 한동안 움직임.
  # 높을수록(0.7~1.0): 빠르게 정지. 1.0이면 즉시 0.
  #
  # 권장: 넘어짐 방지 → 0.3 / 보통 → 0.5 / 즉시 정지 → 1.0
  stop_decay_alpha: 0.5

# ==========================================================================
# Presets (원하는 프리셋을 위쪽 smoothing: 아래에 붙여넣어 사용)
# ==========================================================================
#
# [safe]   – 보수적. 실제 로봇 첫 테스트용.
#   alpha: 0.2
#   max_delta_vx: 0.08
#   max_delta_vy: 0.08
#   max_delta_vyaw: 0.1
#   deadband: 0.12
#   stop_decay_alpha: 0.3
#
# [balanced] – 기본값. 대부분 상황에 무난.
#   alpha: 0.3
#   max_delta_vx: 0.15
#   max_delta_vy: 0.15
#   max_delta_vyaw: 0.2
#   deadband: 0.08
#   stop_decay_alpha: 0.5
#
# [sport]  – 민첩. 시뮬레이션 or 안정적인 보행.
#   alpha: 0.5
#   max_delta_vx: 0.25
#   max_delta_vy: 0.25
#   max_delta_vyaw: 0.3
#   deadband: 0.03
#   stop_decay_alpha: 0.7
#
# [raw]    – 필터 없음. 디버깅/비교용.
#   alpha: 1.0
#   max_delta_vx: 1.0
#   max_delta_vy: 1.0
#   max_delta_vyaw: 1.0
#   deadband: 0.0
#   stop_decay_alpha: 1.0
# ==========================================================================
